name: Render reels

# Maakt reel.mp4 + thumb.jpg voor elke reel-post (post.json met "type": "reel") die nog geen video heeft,
# en commit die terug naar dezelfde branch. Draait vanzelf bij een push naar een week-branch.
# Opnieuw maken (bijv. na een tekstwijziging): Actions > Render reels > Run workflow, met force aan.
on:
  push:
    branches: ["week-*"]
    paths: ["posts/queue/**/post.json", "scripts/reel.py"]
  workflow_dispatch:
    inputs:
      force:
        description: "Alle reels opnieuw maken"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: reels-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==11.3.0 edge-tts==7.2.8
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg && ffmpeg -version | head -1
      - name: Render
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
        run: |
          set -o pipefail
          python scripts/reel.py --all ${{ inputs.force && '--force' || '' }} 2>&1 | tee render.log || {
            echo "::error title=Render failed::$(tail -c 3500 render.log | tr '\n' ' ')"; exit 1; }
          rm -f render.log
      - name: Commit videos
        run: |
          git config user.name "isla-autopost"
          git config user.email "actions@users.noreply.github.com"
          git add posts/queue
          git diff --cached --quiet || (git commit -m "Render reels [skip ci]" && git push)
